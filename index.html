<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Mateo: a clean, fast search page.">
    <title>Mateo</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2326406d'/%3E%3Cpath d='M16 5l9 11-9 11-9-11z' fill='%23bfe3ff'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="./index.css">
</head>

<body>
    <div class="container">
        <div class="topbar">
            <h1 class="site-title">Mateo</h1>
            <label class="theme-control" title="Color theme">
                <svg viewBox="0 0 24 24" aria-hidden=" true">
                    <circle cx="12" cy="12" r="3.5"/>
                    <path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/>
                </svg>
                <select id="theme-select" aria-label="Color theme">
                    <option value="system">System</option>
                    <option value="day">Light</option>
                    <option value="night">Dark</option>
                </select>
            </label>
        </div>

        <form class="box" id="search-form" role="search" action="https://www.google.com/search" method="get" autocomplete="off">
            <button class="search-btn" type="submit" aria-label="Search">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
            </button>

            <input type="search" id="search-input" name="q" placeholder="Search..."
                   aria-label="Search" role="combobox" aria-autocomplete="list"
                   aria-controls="suggestions" aria-expanded="false"
                   autocomplete="off" spellcheck="false">

            <button class="clear-btn" id="clear-btn" type="button" aria-label="Clear search">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>

            <ul class="suggestions" id="suggestions" role="listbox" aria-label="Suggestions"></ul>
        </form>

        <p class="search-status" id="search-status" role="status" aria-live="polite" hidden></p>
        <nav class="shortcuts" id="shortcuts" aria-label="Quick links"></nav>

        <p class="hint">Press <kbd>/</kbd> to start searching</p>

        <section class="mateo-assistant" aria-labelledby="mateo-assistant-title">
            <button id="mateo-core" class="mateo-core" type="button"
                    data-mateo-state="off"
                    aria-label="Turn Mateo voice assistant on or off"></button>
            <div class="mateo-assistant-copy">
                <h2 id="mateo-assistant-title">Talk to Mateo</h2>
                <p id="mateo-status" aria-live="polite">Offline. Tap the core to start.</p>
                <p id="mateo-heard" aria-live="polite"></p>
            </div>
        </section>

        <section id="mateo-answer" class="mateo-answer" hidden aria-live="polite"></section>
    </div>

    <script>
        window.MATEO_VOICE = {
            searchInput: "#search-input",
            trigger: "#mateo-core",
            statusOnly: true,
            answerEndpoint: "/api/answer"
        };
    </script>
    <script src="./index.js"></script>
    <script src="./mateo-voice.js" defer></script>
    <script>
        const mateoStatus = document.getElementById("mateo-status");
        const mateoHeard = document.getElementById("mateo-heard");
        const mateoAnswer = document.getElementById("mateo-answer");

        function renderMateoAnswer(query, result) {
            mateoAnswer.hidden = false;
            mateoAnswer.replaceChildren();

            const heading = document.createElement("h2");
            heading.textContent = query;
            const text = document.createElement("p");
            text.textContent = result.text || result.answer || "";
            mateoAnswer.append(heading, text);

            if (result.url) {
                const source = document.createElement("a");
                source.href = result.url;
                source.target = "_blank";
                source.rel = "noopener";
                source.textContent = "Read the source";
                mateoAnswer.append(source);
            }
        }

        document.addEventListener("mateo:state", function (event) {
            mateoStatus.textContent = event.detail.label;
            if (event.detail.state === "sleeping") mateoHeard.textContent = "";
        });
        document.addEventListener("mateo:notice", function (event) {
            mateoStatus.textContent = event.detail;
        });
        document.addEventListener("mateo:heard", function (event) {
            mateoHeard.textContent = event.detail ? "“" + event.detail + "”" : "";
        });
        document.addEventListener("mateo:query", function (event) {
            mateoHeard.textContent = "“" + event.detail.query + "”";
        });
        document.addEventListener("mateo:answer", function (event) {
            renderMateoAnswer(event.detail.query, event.detail);
        });
    </script>
</body>
</html>
